services:
  backend:
    build: .
    network_mode: "host"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - AEGIS_MODE=simulate
      - AEGIS_IFACE=eth0
      - NAD_CAPTURE_MODE=simulate
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./tests:/app/tests
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend:
    image: node:20
    network_mode: "host"
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
