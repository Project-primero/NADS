services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NAD_CAPTURE_MODE=simulate
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./backend:/app/backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5174:5174"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
